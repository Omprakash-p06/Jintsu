name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend/[dev]"

      - name: Run Ruff Linter
        run: ruff check backend/

      - name: Run Ruff Formatter Check
        run: ruff format --check backend/

      - name: Run Pyright Type Checker
        run: pyright -p backend

      - name: Run Pytest Suite
        run: pytest backend/tests/ -v

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Run ESLint
        run: npm --prefix frontend run lint

      - name: Run TypeScript Check
        run: npm --prefix frontend run typecheck

      - name: Build Next.js Application
        run: npm --prefix frontend run build

  security:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit semgrep
          npm --prefix frontend install

      - name: Run Security Audit Script
        run: ./scripts/run_security_audit.sh

  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          npm --prefix frontend install
          npx --prefix frontend playwright install --with-deps chromium firefox

      - name: Start FastAPI Backend
        run: |
          uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 &
          sleep 2
        working-directory: backend
        env:
          USE_MOCK_PROVIDERS: "true"

      - name: Start Next.js Frontend
        run: |
          npm run build
          npm run start -- -p 3000 &
          sleep 3
        working-directory: frontend
        env:
          JINTRU_API_URL: "http://127.0.0.1:8000"

      - name: Run Playwright Tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://127.0.0.1:3000"
