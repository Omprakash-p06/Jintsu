<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jintru-bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="42" y1="36" x2="138" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="20" y="20" width="140" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container with modern rounded geometry -->
  <rect width="180" height="180" rx="42" fill="url(#jintru-bg)" />
  <rect x="1.5" y="1.5" width="177" height="177" rx="40.5" stroke="#1e293b" stroke-width="3" />

  <!-- Background glow behind the shield -->
  <circle cx="90" cy="88" r="44" fill="#0284c7" opacity="0.22" filter="url(#glow)" />

  <!-- Jintru Verification Shield -->
  <path d="M90 38C116 38 136 44 136 68C136 102 112 128 90 144C68 128 44 102 44 68C44 44 64 38 90 38Z" fill="url(#shield-grad)" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Central Reality Check Verification Glyphs -->
  <path d="M68 88L82 102L116 68" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="90" cy="52" r="3.5" fill="#ffffff" />
</svg>