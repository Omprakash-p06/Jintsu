version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_PROVIDERS=true
      - DATABASE_PATH=data/jintru.db
      - REQUEST_DEADLINE_SECONDS=8.0
      - BRAVE_RETRIEVAL_MODE=snippets
      - CACHE_ENABLED=true
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - JINTRU_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
